schema_version: "1.0"

provider:
  id: "cursor"
  name: "Cursor Composer"
  description: "Traces generated by Cursor Agent and Composer MCP tools and terminal actions."

source:
  type: "file"
  path_patterns:
    - "~/.cursor/composer-logs/*.jsonl"
    - "~/.config/Cursor/logs/*.jsonl"
  format: "jsonl"

extraction:
  session:
    path_regex: "([^/]+)\\.jsonl"
    id_jsonpath: "composer_id"

  events:
    tool_call_filter: "type == 'tool_call' || event == 'tool_executed'"
    subagent_spawn_filter: "tool_calls[?name == 'subagent']"

  fields:
    call_id: "id"
    parent_id: "parent_id"
    timestamp: "timestamp"
    duration_ms: "duration_ms"
    call_type: "type"
    tool_name: "tool"
    mcp_server: "server"
    arguments: "args"
    status: "status"
    output: "result"
    error_message: "error"

anomaly_rules:
  auth_failure_regex:
    - "(?i)unauthorized|\\b401\\b|\\b403\\b|token\\s+expired|authentication\\s+failed"
  # Failed MCP / Skill calls followed by a shell or HTTP call are detected by the core for
  # every provider (with rules/substitutes.yaml raising confidence). List only pairs that are
  # specific to this agent here.
  known_fallbacks: []
