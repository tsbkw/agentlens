schema_version: "1.0"

provider:
  id: "antigravity"
  name: "Google Antigravity"
  description: "Traces generated by Antigravity CLI and IDE subagents/skills/MCPs."

source:
  type: "file"
  path_patterns:
    - "~/.gemini/antigravity-cli/brain/*/.system_generated/logs/transcript.jsonl"
    - "~/.gemini/antigravity-cli/brain/*/system_generated/logs/transcript.jsonl"
  format: "jsonl"

extraction:
  session:
    path_regex: "brain/([a-zA-Z0-9_-]+)/.*transcript\\.jsonl"
    id_jsonpath: "session_id"

  events:
    tool_call_filter: "type == 'PLANNER_RESPONSE' && tool_calls != null"
    subagent_spawn_filter: "tool_calls[?name == 'invoke_subagent']"

  fields:
    call_id: "tool_call.id || step_index"
    parent_id: "parent_call_id || conversation_id"
    timestamp: "created_at"
    duration_ms: "duration_ms"
    call_type: "tool_call.type"
    tool_name: "tool_call.name"
    mcp_server: "tool_call.mcp_server || null"
    arguments: "tool_call.args || tool_call.arguments"
    status: "status"
    output: "tool_call.output"
    error_message: "tool_call.error"

  turns:
    filter: "type == 'USER_INPUT'"
    prompt_field: "content"
    timestamp_field: "created_at"
    prompt_tag: "USER_REQUEST"

  results:
    # The step following a tool call (step N+1) carries that call's result.
    correlation: "previous_step"
    step_index_field: "step_index"
    output_field: "content"
    status_field: "status"

  scopes:
    # Skills are activated by reading their instruction file
    - tool_name: "view_file"
      kind: "skill"
      name_field: "AbsolutePath"
      name_regex: "/skills/([^/]+)/SKILL\\.md$"
    - tool_name: "skill_*"
      kind: "skill"
      name_regex: "^skill_(.+)$"
    - tool_name: "invoke_subagent"
      kind: "subagent"
      name_field: "Subagents.0.Role || Subagents.0.TypeName || Role || TypeName"

anomaly_rules:
  # Auth failures are matched only in the text of failed calls, and a bare "401"/"403" is not
  # enough (file sizes, line numbers and table cells carry those digits). The code must come
  # with an HTTP / status / error prefix or a word such as "Unauthorized" or "Forbidden".
  auth_failure_regex:
    - "(?i)\\bunauthorized\\b|bad credentials|invalid[ _-]?(?:api[ _-]?key|token|credentials)|token\\s+(?:has\\s+)?(?:expired|invalid|revoked)|(?:re-?)?auth(?:entication|orization)\\s+(?:failed|required|error)|requires\\s+re-?auth|not\\s+authenticated|\\b(?:http|status(?:\\s+code)?|code|error)\\b[\"']?\\s*[:=]?\\s*[\"'(]?40[13]\\b|\\b40[13]\\s+\\(?(?:unauthorized|forbidden|authorization|authentication|client\\s+error|error|post|get|put|patch|delete|for)\\b|\\(40[13]\\)"
  # Failed MCP / Skill calls followed by a shell or HTTP call are detected by the core for
  # every provider (with rules/substitutes.yaml raising confidence). List only pairs that are
  # specific to this agent here.
  known_fallbacks: []
