schema_version: "1.0"

provider:
  id: "claude-code"
  name: "Claude Code"
  description: "Traces generated by Anthropic Claude Code agent sessions and MCP tool calls."

source:
  type: "file"
  path_patterns:
    - "~/.claude/projects/*/*.jsonl"
  format: "jsonl"
  # Subagents (Agent tool) write their own transcript next to the session; the sidecar
  # metadata names the Agent tool_use that spawned them.
  child_traces:
    path_glob: "{dir}/{stem}/subagents/*.jsonl"
    sidecar_suffix: ".meta.json"
    parent_call_id_field: "toolUseId"

extraction:
  session:
    # ~/.claude/projects/<encoded-cwd>/<session-uuid>.jsonl
    path_regex: "projects/[^/]+/([^/]+)\\.jsonl$"
    id_jsonpath: "sessionId"

  events:
    # Tool calls are "tool_use" content blocks inside assistant messages.
    tool_call_filter: "type == 'assistant'"
    tool_calls_path: "message.content"
    tool_call_item_filter: "type == 'tool_use'"

  fields:
    call_id: "id"
    timestamp: "timestamp"
    tool_name: "name"
    # MCP tools are named mcp__<server>__<tool>
    mcp_server_regex: "^mcp__(.+?)__"
    arguments: "input"

  turns:
    # Real prompts are user messages that are not tool results, meta/compaction messages,
    # or background task notifications.
    filter: "type == 'user' && toolUseResult == null && isMeta != true && isCompactSummary != true && origin.kind != 'task-notification'"
    prompt_field: "message.content"
    timestamp_field: "timestamp"
    # Slash commands are recorded as <command-name>/cmd</command-name>...
    prompt_tag: "command-name"

  results:
    correlation: "call_id"
    filter: "type == 'user'"
    items_path: "message.content"
    item_filter: "type == 'tool_result'"
    call_id_field: "tool_use_id"
    output_field: "content"
    error_flag_field: "is_error"
    timestamp_field: "timestamp"

  scopes:
    - tool_name: "Skill"
      kind: "skill"
      name_field: "skill"
    # Subagents log their own calls to <session>/subagents/agent-*.jsonl, so the
    # main agent's following calls stay in the caller's scope.
    - tool_name: "Agent"
      kind: "subagent"
      name_field: "subagent_type || description"
      enter_scope: false
    # Name used by older Claude Code versions
    - tool_name: "Task"
      kind: "subagent"
      name_field: "subagent_type || description"
      enter_scope: false

anomaly_rules:
  auth_failure_regex:
    - "(?i)unauthorized|\\b401\\b|\\b403\\b|token\\s+expired|authentication\\s+failed"
  known_fallbacks:
    - original_tool: "mcp__*"
      fallback_tool: "Bash"
      description: "MCP tool failed or unauthenticated; Claude Code silently fell back to raw Bash execution."
    - original_tool: "mcp__*"
      fallback_tool: "WebFetch"
      description: "MCP tool failed; Claude Code fell back to fetching the resource over plain HTTP."
