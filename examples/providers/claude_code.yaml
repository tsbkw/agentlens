schema_version: "1.0"

provider:
  id: "claude-code"
  name: "Claude Code"
  description: "Traces generated by Anthropic Claude Code agent sessions and MCP tool calls."

source:
  type: "file"
  path_patterns:
    - "~/.claude/logs/*.jsonl"
    - "~/.claude/projects/*/*.jsonl"
  format: "jsonl"

extraction:
  session:
    path_regex: "(?:logs|projects)/([^/]+)/.*\\.jsonl"
    id_jsonpath: "session_id"

  events:
    tool_call_filter: "type == 'tool_use' || message.content[?type == 'tool_use']"
    subagent_spawn_filter: "tool_calls[?name == 'Agent']"

  fields:
    call_id: "id"
    parent_id: "parent_id"
    timestamp: "timestamp"
    duration_ms: "duration_ms"
    call_type: "type"
    tool_name: "name"
    mcp_server: "server_name"
    arguments: "input"
    status: "status"
    output: "output"
    error_message: "error"

anomaly_rules:
  auth_failure_regex:
    - "(?i)unauthorized|401|403|token\\s+expired|authentication\\s+failed"
  known_fallbacks:
    - original_tool: "mcp_*"
      fallback_tool: "Bash"
      description: "MCP tool failed or unauthenticated; Claude Code silently fell back to raw Bash execution."
    - original_tool: "mcp_*"
      fallback_tool: "command_run"
      description: "MCP tool failed; agent fell back to shell execution."
