schema_version: "1.0"

provider:
  id: "claude-code"
  name: "Claude Code"
  description: "Traces generated by Anthropic Claude Code agent sessions and MCP tool calls."

source:
  type: "file"
  path_patterns:
    - "~/.claude/projects/*/*.jsonl"
  format: "jsonl"
  # Subagents write their own transcript next to the session. The sidecar metadata names
  # the Agent tool_use that spawned them; subagents forked by a Skill have no such ID, but
  # the Skill's tool result carries their agentId.
  child_traces:
    path_glob: "{dir}/{stem}/subagents/*.jsonl"
    sidecar_suffix: ".meta.json"
    parent_call_id_field: "toolUseId"
    child_id_field: "agentId"
    result_child_id_field: "toolUseResult.agentId"
    sidecar_name_field: "name || agentType || description"

extraction:
  session:
    # ~/.claude/projects/<encoded-cwd>/<session-uuid>.jsonl
    path_regex: "projects/[^/]+/([^/]+)\\.jsonl$"
    id_jsonpath: "sessionId"

  events:
    # Tool calls are "tool_use" content blocks inside assistant messages.
    tool_call_filter: "type == 'assistant'"
    tool_calls_path: "message.content"
    tool_call_item_filter: "type == 'tool_use'"

  fields:
    call_id: "id"
    timestamp: "timestamp"
    tool_name: "name"
    # MCP tools are named mcp__<server>__<tool>
    mcp_server_regex: "^mcp__(.+?)__"
    arguments: "input"

  turns:
    # Real prompts are user messages that are not tool results, meta/compaction messages,
    # or background task notifications.
    filter: "type == 'user' && toolUseResult == null && isMeta != true && isCompactSummary != true && origin.kind != 'task-notification'"
    prompt_field: "message.content"
    timestamp_field: "timestamp"
    # Slash commands are recorded as <command-name>/cmd</command-name>...
    prompt_tag: "command-name"

  results:
    correlation: "call_id"
    filter: "type == 'user'"
    items_path: "message.content"
    item_filter: "type == 'tool_result'"
    call_id_field: "tool_use_id"
    output_field: "content"
    error_flag_field: "is_error"
    timestamp_field: "timestamp"
    # Claude Code's own refusals: the call never ran (user rejection, permission rules,
    # auto mode classifier). Errors reported by a tool that did run are not matched.
    denied_regex:
      - "^The user doesn't want to proceed with this tool use"
      - "^Permission for this action was denied"
      - "^Permission to use \\S+ "
      - "^The server-side auto mode classifier gave no verdict"
      - "^\\S+ is temporarily unavailable .*auto mode cannot determine"
      - "^<tool_use_error>File is in a directory that is denied by your permission settings"
      - "^<tool_use_error>Blocked: "

  # Bookkeeping tools: tool discovery, task tracking, planning, questions, scheduling and
  # agent messaging. They never do the user's task themselves.
  auxiliary_tools:
    - "ToolSearch"
    - "TodoWrite"
    - "TaskCreate"
    - "TaskUpdate"
    - "TaskGet"
    - "TaskList"
    - "TaskOutput"
    - "TaskStop"
    - "AskUserQuestion"
    - "EnterPlanMode"
    - "ExitPlanMode"
    - "ScheduleWakeup"
    - "Cron*"
    - "ListAgents"
    - "SendMessage"
    - "SubagentHandback"
    - "StructuredOutput"
    - "EnterWorktree"
    - "ExitWorktree"
    - "ListMcpResourcesTool"

  scopes:
    - tool_name: "Skill"
      kind: "skill"
      name_field: "skill"
    # Subagents log their own calls to <session>/subagents/agent-*.jsonl, so the
    # main agent's following calls stay in the caller's scope.
    - tool_name: "Agent"
      kind: "subagent"
      name_field: "subagent_type || description"
      enter_scope: false
    # Name used by older Claude Code versions
    - tool_name: "Task"
      kind: "subagent"
      name_field: "subagent_type || description"
      enter_scope: false

anomaly_rules:
  auth_failure_regex:
    - "(?i)unauthorized|\\b401\\b|\\b403\\b|token\\s+expired|authentication\\s+failed"
  # Failed MCP / Skill calls followed by a shell or HTTP call are detected by the core for
  # every provider (with rules/substitutes.yaml raising confidence). List only pairs that are
  # specific to this agent here.
  known_fallbacks: []
